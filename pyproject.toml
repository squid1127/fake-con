[project]
name = "fake-con"
version = "0.1.0"
description = "Testing for pro-con emulation"
authors = [
    { name = "squid1127", email = "<120748767+squid1127@users.noreply.github.com>" },
]
license = "MIT"
requires-python = ">=3.13, <4.0"
dependencies = [
    "aioconsole (>=0.8.2,<0.9.0)",
    "hid (>=1.0.9,<2.0.0)",
    "crc8 (>=0.2.1,<0.3.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "dbus-python (>=1.4.0,<2.0.0)",
    "setuptools (>=84.0.0,<85.0.0)",
    "pygobject (>=3.58.0,<4.0.0)",
    "evdev (>=2.0.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
run_controller_cli = "fake_con.run_controller_cli:main"
[dependency-groups]
dev = ["ruff (>=0.16.6,<0.17.0)"]
